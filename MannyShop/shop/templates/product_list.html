<!DOCTYPE html>
<html>
<head>
    <title>RueShop - Products</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            color: #333;
            min-height: 100vh;
        }
        nav {
            background: #3a3a3a;
            color: #f4e6d7;
            padding: 18px 0;
            text-align: center;
            position: relative;
            border-bottom: 3px solid #8B4513;
        }
        nav::before {
            content: 'Products';
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            color: #8B4513;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        nav a {
            color: #f4e6d7;
            text-decoration: none;
            margin: 0 18px;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #8B4513;
            margin-bottom: 40px;
            font-size: 36px;
        }
        .product {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        .product img {
            max-width: 150px;
            height: auto;
            margin-right: 20px;
            border-radius: 8px;
        }
        .product h2 {
            margin: 0 0 10px 0;
            color: #8B4513;
        }
        .product p {
            margin: 5px 0;
            line-height: 1.5;
        }
        .price {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
        }
        button {
            background: #8B4513;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s;
        }
        button:hover {
            background: #5c381d;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'product_list' %}">Products</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="{% url 'contact' %}">Contact</a>
    </nav>
    <div class="container">
        <h1>RueShop Collection</h1>
        {% for product in products %}
        <div class="product">
            {% if product.image %}
            <img src="{{ product.image }}" alt="{{ product.name }}">
            {% endif %}
            <div>
                <h2>{{ product.name }}</h2>
                <p>{{ product.description }}</p>
                <p class="price">${{ product.price }}</p>
                <form method="post" action="{% url 'add_to_cart' product.id %}">
                    {% csrf_token %}
                    <button type="submit">Add to Cart</button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
